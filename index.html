<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#466b53">
<meta name="description" content="姥姥、姥爷和小宝的快乐日常：坐车、逛公园、看动物，把一起度过的小日子留在这里。">
<title>姥姥姥爷和小宝的快乐日常</title>
<style>
:root{--paper:#faf7ee;--ink:#283c30;--green:#466b53;--muted:#737c70;--sun:#f4c86b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}.wrap{max-width:1080px;margin:auto;padding:0 20px}.hero{padding:42px 0 35px;background:radial-gradient(ellipse at top right,#e2ead9,transparent 70%)}.eyebrow{letter-spacing:.15em;color:var(--green);font-size:12px;font-weight:700}.hero h1{font:600 clamp(38px,6vw,68px)/1.15 "Songti SC",serif;letter-spacing:-.045em;margin:14px 0}.hero h1 span{display:block}.lead{color:var(--muted);max-width:550px;margin:15px 0 26px}.cover{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}.cover figure{margin:0;border-radius:24px;overflow:hidden;background:#e4e5d6;position:relative}.cover img{display:block;width:100%;height:420px;object-fit:cover;object-position:center 38%}.cover figcaption{position:absolute;bottom:0;padding:40px 16px 16px;color:white;background:linear-gradient(transparent,#182b23b8);width:100%;font-weight:600}.note{padding:30px 0 36px}.note p{margin:0;color:var(--muted)}.note strong{color:var(--green);font-weight:600}.nav-shell{position:sticky;top:0;z-index:10;background:#faf7eef5;border-block:1px solid #466b5320;backdrop-filter:blur(12px)}.filters,.scenes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0}.filters::-webkit-scrollbar,.scenes::-webkit-scrollbar{display:none}.chip{flex:none;border:0;border-radius:30px;padding:10px 17px;min-height:44px;background:#e9ecdf;color:var(--green);font-size:14px;font-weight:650}.chip[aria-pressed=true]{background:var(--green);color:white}.scenes{padding:0 0 12px;gap:6px}.scene{border:1px solid #466b5330;background:transparent;padding:6px 13px;min-height:36px;border-radius:24px;color:var(--muted);white-space:nowrap;font-size:13px}.scene[aria-pressed=true]{background:#f5e6bb;border-color:#e7ce8f;color:var(--ink)}main{padding-bottom:65px}.gallery-head{display:flex;justify-content:space-between;align-items:center;padding:26px 0 20px;gap:10px}.gallery-head h2{font:600 25px/1.3 "Songti SC",serif;margin:0}.count{font-size:13px;color:var(--muted)}.random{border:0;background:var(--sun);color:var(--ink);padding:8px 13px;border-radius:30px;font-size:13px;min-height:42px}.gallery{columns:3;column-gap:16px}.card{break-inside:avoid;margin:0 0 16px;background:#fffdf7;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 5px 20px #223b2610}.open-photo{display:block;padding:0;border:0;background:transparent;width:100%;text-align:left;color:inherit}.card img{display:block;width:100%;height:auto}.caption{display:block;padding:11px 13px 13px;font-size:14px;line-height:1.5}.caption small{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border:0;border-radius:50%;background:#253a30a8;color:white;font-size:22px}.heart.saved{background:var(--green);color:var(--sun)}.empty{text-align:center;padding:50px;color:var(--muted)}footer{background:#dfe7d8;padding:36px 0 90px}footer h2{font:600 28px/1.4 "Songti SC",serif;margin:0 0 12px}footer p{color:var(--muted);font-size:14px;margin:0}.music{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:25;border:0;border-radius:30px;color:white;background:var(--green);padding:11px 16px;min-height:46px;box-shadow:0 5px 20px #283c3030;font-size:14px}.lightbox{position:fixed;inset:0;z-index:40;background:#14231ff5;color:white;display:none;grid-template-rows:1fr auto}.lightbox.open{display:grid}.stage{display:grid;place-items:center;min-height:0;padding:calc(62px + env(safe-area-inset-top)) 20px 16px}.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}.close,.prev,.next{position:absolute;border:0;color:white;background:#ffffff25;border-radius:50%;width:44px;height:44px;font-size:28px}.close{right:15px;top:calc(12px + env(safe-area-inset-top))}.prev{left:10px;top:48%}.next{right:10px;top:48%}.lb-info{text-align:center;padding:10px 18px calc(18px + env(safe-area-inset-bottom));font-size:15px}.lb-info small{display:block;color:#ffffff80;font-size:12px;margin-top:6px}.no-scroll{overflow:hidden}
@media(max-width:700px){.wrap{padding-inline:14px}.hero{padding-top:28px}.hero h1{font-size:clamp(34px,9.7vw,55px)}.lead{font-size:14px}.cover{grid-template-columns:1.1fr 1fr;gap:8px}.cover figure:first-child{grid-row:span 2}.cover img{height:180px}.cover figure:first-child img{height:368px}.cover figure{border-radius:16px}.cover figcaption{font-size:12px;padding:32px 10px 10px}.note{font-size:14px;padding:25px 0}.filters{margin-right:-14px;padding-right:14px}.chip{font-size:13px;padding:10px 14px}.gallery{columns:2;column-gap:10px}.card{margin-bottom:10px;border-radius:14px}.caption{font-size:12px;padding:9px 10px 11px}.gallery-head h2{font-size:22px}.prev,.next{display:none}footer h2{font-size:25px}.heart{width:34px;height:34px}.music{font-size:13px;right:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<div class="eyebrow">把好日子，装进相册</div>
<h1><span>姥姥姥爷和小宝的</span><span>快乐日常</span></h1>
<p class="lead">坐一趟车，逛一座公园，认识几个小动物。小宝忙着长大，姥姥姥爷也忙着把日子过得有意思。</p>
<div class="cover">
<figure><img src="assets/photos/gm_013.jpeg" alt="姥姥姥爷和小宝的电梯合影" fetchpriority="high"><figcaption>三个人，一起出发</figcaption></figure>
<figure><img src="assets/photos/gm_001.jpeg" alt="姥姥笑着抱小宝"><figcaption>姥姥的笑容，先到一步</figcaption></figure>
<figure><img src="assets/photos/gp_126.jpeg" alt="姥爷和小宝一起坐公交车"><figcaption>靠窗座位，风景管够</figcaption></figure>
</div></div></header>
<section class="wrap note"><p><strong>给姥姥姥爷留一本日常相册。</strong><br>有你们自己的小时光，也有陪小宝出门的小旅程。照片不用太正式，笑得自然就很好。</p></section>
<nav class="nav-shell" aria-label="照片分类"><div class="wrap">
<div class="filters">
<button class="chip" data-filter="all" aria-pressed="true">全部日常</button>
<button class="chip" data-filter="grandma" aria-pressed="false">姥姥</button>
<button class="chip" data-filter="grandpa" aria-pressed="false">姥爷</button>
<button class="chip" data-filter="family" aria-pressed="false">姥姥姥爷和小宝</button>
<button class="chip" data-filter="saved" aria-pressed="false">♡ 收藏</button>
</div>
<div class="scenes" aria-label="场景筛选" hidden></div>
</div></nav>
<main class="wrap"><div class="gallery-head"><div><h2 id="category-title">一起过的小日子</h2><span class="count"></span></div><button class="random">随手翻一张 ✦</button></div><div class="gallery"></div><div class="empty" hidden>暂时没有照片，换一个分类看看吧。</div></main>
<footer><div class="wrap"><h2>下次出门，<br>记得再拍一张。</h2><p>大人的好心情，小宝的新发现，都值得留下来。</p><p style="margin-top:22px;font-size:12px">家庭相册，请珍惜照片，不随意转发。</p></div></footer>
<button class="music" aria-pressed="false">♪ 开启音乐</button>
<div class="lightbox" role="dialog" aria-modal="true" aria-label="照片查看器"><button class="close" aria-label="关闭">×</button><button class="prev" aria-label="上一张">‹</button><div class="stage"><img alt=""></div><button class="next" aria-label="下一张">›</button><div class="lb-info"></div></div>
<script src="album.js"></script>
<script>
const gallery=document.querySelector('.gallery'), chips=[...document.querySelectorAll('.chip')], scenes=document.querySelector('.scenes'), lightbox=document.querySelector('.lightbox');
let filter='all',scene='全部场景',active=photos,index=0,touchX=0,lastFocus=null;
let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('grandparents-favorites')||'[]'))}catch(_){}
const titles={all:'一起过的小日子',grandma:'姥姥的小时光',grandpa:'跟着姥爷去看看',family:'一家人的同框时刻',saved:'留住喜欢的瞬间'};
function matches(p){return filter==='all'||filter==='saved'&&saved.has(p.file)||filter==='family'&&p.category==='family'||filter==='grandma'&&(p.category==='grandma'||p.category==='family')||filter==='grandpa'&&(p.category==='grandpa'||p.category==='family')}
function render(){
 active=photos.filter(p=>matches(p)&&(scene==='全部场景'||p.scene===scene));
 document.querySelector('#category-title').textContent=titles[filter];document.querySelector('.count').textContent=`${active.length} 张照片 · 点开看大图`;
 gallery.innerHTML=active.map((p,i)=>`<article class="card"><button class="open-photo" data-index="${i}" aria-label="查看：${p.caption}"><img src="assets/photos/${p.file}" alt="${p.caption}" loading="lazy" decoding="async"><span class="caption"><small>${p.scene}</small>${p.caption}</span></button><button class="heart ${saved.has(p.file)?'saved':''}" data-file="${p.file}" aria-label="${saved.has(p.file)?'取消收藏':'收藏照片'}" aria-pressed="${saved.has(p.file)}">${saved.has(p.file)?'♥':'♡'}</button></article>`).join('');
 document.querySelector('.empty').hidden=active.length!==0;
}
function updateScenes(){scenes.hidden=filter!=='grandpa';scenes.style.display=filter==='grandpa'?'flex':'none';scenes.innerHTML=['全部场景','坐车','动物园','公园','游乐场','一起出门','在家','小时光'].map(s=>`<button class="scene" aria-pressed="${s===scene}">${s}</button>`).join('')}
chips.forEach(c=>c.addEventListener('click',()=>{filter=c.dataset.filter;scene='全部场景';chips.forEach(x=>x.setAttribute('aria-pressed',x===c));updateScenes();render()}));
scenes.addEventListener('click',e=>{const b=e.target.closest('.scene');if(b){scene=b.textContent;updateScenes();render()}});
function show(){const p=active[index];if(!p)return;const img=lightbox.querySelector('img');img.src='assets/photos/'+p.file;img.alt=p.caption;document.querySelector('.lb-info').innerHTML=`${p.caption}<small>${index+1} / ${active.length} · 左右滑动翻照片</small>`}
function openPhoto(i){index=i;lastFocus=document.activeElement;lightbox.classList.add('open');document.body.classList.add('no-scroll');show();lightbox.querySelector('.close').focus()}
function closePhoto(){lightbox.classList.remove('open');document.body.classList.remove('no-scroll');lastFocus?.focus()}
function step(d){index=(index+d+active.length)%active.length;show()}
gallery.addEventListener('click',e=>{const heart=e.target.closest('.heart');if(heart){const f=heart.dataset.file;saved.has(f)?saved.delete(f):saved.add(f);try{localStorage.setItem('grandparents-favorites',JSON.stringify([...saved]))}catch(_){}render();return}const b=e.target.closest('.open-photo');if(b)openPhoto(Number(b.dataset.index))});
document.querySelector('.random').onclick=()=>{if(active.length)openPhoto(Math.floor(Math.random()*active.length))};
lightbox.querySelector('.close').onclick=closePhoto;lightbox.querySelector('.prev').onclick=()=>step(-1);lightbox.querySelector('.next').onclick=()=>step(1);
lightbox.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});lightbox.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>48)step(d>0?-1:1)},{passive:true});
document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Tab'){e.preventDefault();const b=[...lightbox.querySelectorAll('button')].filter(x=>getComputedStyle(x).display!=='none');let i=b.indexOf(document.activeElement);b[(i+(e.shiftKey?-1:1)+b.length)%b.length].focus()}});
const music=document.querySelector('.music'),notes=[[60,.6],[64,.6],[67,.9],[69,.6],[67,.6],[64,.9],[62,.6],[64,.6],[60,1.2],[60,.6],[62,.6],[64,.9],[67,.6],[64,.6],[62,.9],[59,.6],[62,.6],[60,1.3]];
let context=null,wanted=true,playing=false,timer=null;const phraseLength=notes.reduce((a,n)=>a+n[1],0)+.45;
function phrase(){let t=context.currentTime+.06;for(const[n,d]of notes){const o=context.createOscillator(),g=context.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+d*.88);o.connect(g).connect(context.destination);o.start(t);o.stop(t+d);t+=d}}
function sync(){const play=wanted&&!document.hidden&&context?.state==='running';if(play&&!playing){playing=true;phrase();timer=setInterval(phrase,phraseLength*1000)}else if(!play){playing=false;clearInterval(timer);timer=null}music.textContent=playing?'♪ 音乐播放中':'♪ 开启音乐';music.setAttribute('aria-pressed',playing)}
function startMusic(){if(!wanted||document.hidden)return;try{if(!context){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;context=new Audio();context.addEventListener('statechange',sync)}context.resume().then(sync).catch(()=>{});sync()}catch(_){}}
music.onclick=()=>{if(playing){wanted=false;sync();context.suspend().catch(()=>{})}else{wanted=true;startMusic()}};
for(const event of ['pointerdown','touchstart','keydown'])document.addEventListener(event,e=>{if(!e.target.closest('.music'))startMusic()},{passive:true});document.addEventListener('WeixinJSBridgeReady',startMusic);document.addEventListener('visibilitychange',()=>{if(document.hidden){sync();context?.suspend().catch(()=>{})}else startMusic()});
updateScenes();render();startMusic();
</script>
</body>
</html>
